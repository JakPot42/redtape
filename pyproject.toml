[project]
name = "redtape"
version = "0.1.0"
description = "Verifiable abstention: does the agent know when a required fact is missing? Deterministic ground truth from PolicyEngine, no LLM judge."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.13,<3.14"
tags = ["single-turn", "v1", "eval", "abstention", "calibration", "public-benefits"]

# Evaluation is ENGINE-FREE. Answer keys are baked into the split at generation time and
# never recomputed at rollout (CLAUDE.md, "Answer keys are baked at generation time"), so
# running this environment needs no microsimulation engine and installs in seconds.
# policyengine-us is required only to GENERATE a new split - see the `generate` extra.
dependencies = [
    "verifiers>=0.3.1",
    "pydantic>=2.12",
]

[project.optional-dependencies]
# Regenerating a split, or re-deriving ground truth. Exact pins, deliberately:
# policyengine-us ships three to four releases a day and rule changes between them
# silently invalidate answer keys, so a split is only meaningful against a stated engine
# version. See docs/LIMITS.md 5 for the golden-master test that enforces this.
generate = [
    "policyengine-us==1.821.4",
    "policyengine-core==3.31.1",
    "pyyaml>=6.0",
]
dev = [
    "pytest>=8.4",
    "ruff>=0.9",
]

[project.urls]
Homepage = "https://github.com/JakPot42/redtape"
Limitations = "https://github.com/JakPot42/redtape/blob/main/docs/LIMITS.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["redtape"]

# The dev split ships with the wheel: it is the environment's data, it is generated from
# the PUBLIC seed (20260828) and is reproducible by anyone, and without it the taskset has
# nothing to load. The held-out split is NOT here and never is - it is gitignored, built
# from a private seed, and excluded from every artifact.
[tool.hatch.build.targets.wheel.force-include]
"data/dev/t1.jsonl" = "redtape/data/t1.jsonl"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"
