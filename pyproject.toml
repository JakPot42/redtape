[project]
name = "redtape"
version = "0.0.1"
description = "Verifiable training-and-evaluation environments for US public-benefits work"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = "==3.13.*"

# Exact pins, never >=. See CLAUDE.md: policyengine-us ships 3-4 releases/day and
# rule changes between them silently invalidate answer keys.
dependencies = [
    "verifiers==0.3.1",
    "policyengine-us==1.821.4",
    # Pinned explicitly, not left transitive. Clearing the uv cache floated this from
    # 3.31.0 to 3.31.1 with nothing to stop it; "pin every dependency" has to mean the
    # closure, not just the names we happened to write down. See CLAUDE.md.
    "policyengine-core==3.31.1",
    "pydantic==2.12.3",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "ruff==0.9.0",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["redtape*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# `eval/` is a top-level directory, not an installed package (packages.find takes
# `redtape*` only), so importing it depends on the repo root being on sys.path. Running
# `python -m pytest` injects the cwd and hides that; running `pytest` does not. Local runs
# passed and the first CI run failed with ModuleNotFoundError purely on that difference.
# Setting it here makes both invocations identical rather than leaving the suite dependent
# on how it happened to be launched.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"
