[project]
name = "redtape"
version = "0.0.1"
description = "Verifiable training-and-evaluation environments for US public-benefits work"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = "==3.13.*"

# Exact pins, never >=. See CLAUDE.md: policyengine-us ships 3-4 releases/day and
# rule changes between them silently invalidate answer keys.
dependencies = [
    "verifiers==0.3.1",
    "policyengine-us==1.821.4",
    "pydantic==2.12.3",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "ruff==0.9.0",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["redtape*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
